# Keeps dependencies current and surfaces security advisories across every ecosystem in the repo.
# Note (I-M3): the docker/* actions in the image workflows are SHA-pinned; the actions/* ones are still
# tag-pinned. Dependabot keeps whatever is pinned up to date and (with the config below) opens PRs that
# can be reviewed to advance to a pinned SHA. Converting the tag pins to SHA pins is a manual one-time
# edit that needs the resolved digests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Bundle only minor/patch bumps into one weekly PR. Major bumps (breaking, e.g.
      # eslint 9->10, typescript 5->6, lucide-react 0.x->1.x) arrive as individual PRs so
      # each can be reviewed and merged on its own instead of blocking the group.
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: nuget
    directories:
      - /apps/core/src/Haas.Hosty.Core
      - /apps/cli/src/Haas.Hosty.Cli
      - /apps/telemetry-backend/src/Haas.Hosty.TelemetryBackend
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/shell
      - /apps/demo-app
      - /apps/telemetry-backend
    schedule:
      interval: weekly
    ignore:
      # Pin the Node base image to the current Active LTS line (24). Node 26 is still a
      # "Current" release until ~Nov 2026; jumping onto a non-LTS line for a production
      # image is deliberate, not automatic. Patch/minor bumps within 24 still flow through.
      # Revisit (drop this ignore) once the desired major reaches Active LTS.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
