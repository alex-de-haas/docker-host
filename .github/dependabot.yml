# Keeps dependencies current and surfaces security advisories across every ecosystem in the repo.
# Note (I-M3): the docker/* actions in the image workflows are SHA-pinned; the actions/* ones are still
# tag-pinned. Dependabot keeps whatever is pinned up to date and (with the config below) opens PRs that
# can be reviewed to advance to a pinned SHA. Converting the tag pins to SHA pins is a manual one-time
# edit that needs the resolved digests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Bundle only minor/patch bumps into one weekly PR. Major bumps (breaking, e.g.
      # lucide-react 0.x->1.x) arrive as individual PRs so each can be reviewed and
      # merged on its own instead of blocking the group.
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # eslint 10 and typescript 6 majors are gated on the Next.js lint preset:
      #   - eslint 10: eslint-config-next@16.2.x bundles an eslint-plugin-react that
      #     crashes under eslint 10 (calls the removed context.getFilename API).
      #   - typescript 6: @typescript-eslint is pulled in transitively by the preset.
      #     The version installed today (8.48.x) peers "typescript <6.0.0", so it
      #     excludes TS 6. Adopting TS 6 requires bumping that stack to >=8.63, which
      #     widens the peer to "typescript <6.1.0".
      # Both Dependabot majors are therefore lockfile no-ops right now. Adopt eslint 10
      # + typescript 6 + the typescript-eslint bump together once eslint-config-next
      # ships eslint-10 support; block the weekly no-op majors until then. Minor/patch
      # (eslint 9.x, typescript 5.x) still flow via the group.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Keep @types/node on the Active LTS line (24), matching the Node 24 runtime used
      # in CI and the `node:24-*` base images pinned below. Node 26 is still "Current"
      # (non-LTS until ~Nov 2026), so its type defs would describe a runtime we don't
      # ship. Bumping the types ahead of the runtime only invites type/runtime skew.
      # Raise this bound in lockstep with the Node base-image pin once 26 is LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: nuget
    directories:
      - /apps/core/src/Haas.Hosty.Core
      - /apps/cli/src/Haas.Hosty.Cli
      - /apps/telemetry-backend/src/Haas.Hosty.TelemetryBackend
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/shell
      - /apps/demo-app
      - /apps/telemetry-backend
      - /apps/marketplace
    schedule:
      interval: weekly
    ignore:
      # Pin the Node base image to the current Active LTS line (24). Node 26 is still a
      # "Current" release until ~Nov 2026; jumping onto a non-LTS line for a production
      # image should be deliberate, not automatic. `node:24-bookworm-slim` is a rolling
      # tag, so the only bumps Dependabot proposes are new majors (25, 26, ...); block
      # those with `versions` (semver `update-types` is unreliable for Docker tags that
      # carry a non-semver suffix). Drop/raise this bound once the target major is LTS.
      - dependency-name: "node"
        versions: [">= 25"]
