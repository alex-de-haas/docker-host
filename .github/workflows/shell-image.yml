name: Shell Image

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  validation:
    # Ignore non-push, failed and foreign CI completions before allocating a runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: Require full CI for this main SHA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.validation.outputs.publish }}
      run-id: ${{ steps.validation.outputs.run-id }}
      source-sha: ${{ steps.validation.outputs.source-sha }}
    steps:
      # Select with trusted default-branch policy, then build only the validated source commit.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Set up Node.js for publication policy
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require successful main CI
        id: validation
        uses: ./.github/actions/ci-validation-gate
        with:
          token: ${{ github.token }}
          components: shell

  # Gate the image push on the Shell build (mirrors CI's Shell job). Catches a broken Shell before the
  # expensive multi-arch image build/push, so publishing is not decoupled from a passing build.
  test:
    needs: validation
    if: needs.validation.outputs.publish == 'true'
    name: Gate on build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validation.outputs.source-sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Shell
        run: npm run shell:build

  build-and-push:
    needs: [validation, test]
    runs-on: ubuntu-latest
    # Serialize publishes and never cancel: two runs racing to move the `:latest` and version tags can
    # leave them pointing at the older image, and a half-finished registry push is worse than a queued
    # one. Only this job is grouped, so the gate tests of a later commit still run in parallel.
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # Signed build-provenance attestation for the pushed image (I-M2).
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validation.outputs.source-sha }}

      - name: Compute image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/hosty-shell" >> "$GITHUB_OUTPUT"

      # Runs inside the concurrency group above, so its answer holds until this job releases the
      # slot. Shell publishes no version tag - its manifest pins `:latest` - so only `latest` is
      # gated here; `sha-<commit>` is immutable and always published.
      - name: Guard mutable tags
        id: guard
        uses: ./.github/actions/publish-guard
        with:
          source-sha: ${{ needs.validation.outputs.source-sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Metadata reads the validated Git commit; a raw SHA checkout has no branch to infer.
      - name: Attach validated source for Git metadata
        env:
          PUBLISH_SOURCE_SHA: ${{ needs.validation.outputs.source-sha }}
        run: git switch --create hosty-publish-source "$PUBLISH_SOURCE_SHA"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          context: git
          images: ${{ steps.image.outputs.name }}
          # `latest` is gated on the guard rather than {{is_default_branch}} - a stricter test, since
          # the commit must still *be* main's tip, not merely have been on main when the run started.
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.guard.outputs.fresh }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Shell image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./apps/shell/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=shell-image
          # mode=max caches the npm ci/build stages too, not just the thin final layer (I-M4).
          cache-to: type=gha,scope=shell-image,mode=max

      - name: Prepare source-bound provenance
        env:
          PUBLISH_SOURCE_SHA: ${{ needs.validation.outputs.source-sha }}
          VALIDATED_CI_RUN_ID: ${{ needs.validation.outputs.run-id }}
          PUBLICATION_KIND: build-image
        run: node .github/actions/ci-validation-gate/provenance.mjs

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: publication-provenance.json
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
