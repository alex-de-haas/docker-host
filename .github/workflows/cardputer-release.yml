name: Cardputer Firmware Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/shell-cardputer/**"
      - ".github/workflows/cardputer-release.yml"

permissions:
  contents: read

jobs:
  publish:
    name: Publish cardputer-dev firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: cardputer-dev-release
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # `cardputer-dev` is force-retagged and its assets are clobbered, and the firmware OTA client
      # downloads from exactly this release, so an older run admitted to the group after a newer one
      # would push stale firmware to every device. Nothing is published unless this commit is still
      # the tip of main; the newer run has already shipped, or is queued behind us.
      #
      # First step after checkout on purpose. Unlike the image workflows, this job builds *inside*
      # its own concurrency group, so a stale run would otherwise hold `cardputer-dev-release` shut
      # through a full ESP-IDF build whose output it then discards, delaying the fresh run behind it.
      # `ci.yml`'s `cardputer-shell` job covers the build on the PR side, so skipping it here costs
      # no validation.
      - name: Guard the rolling tag
        id: guard
        uses: ./.github/actions/publish-guard

      - name: Run bounded host tests
        if: steps.guard.outputs.fresh == 'true'
        run: apps/shell-cardputer/tools/host-test.sh

      - name: Build ESP32-S3 firmware
        if: steps.guard.outputs.fresh == 'true'
        run: apps/shell-cardputer/tools/docker-build.sh

      - name: Prepare release assets
        if: steps.guard.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          image=apps/shell-cardputer/build/hosty_cardputer_shell.bin
          maximum=$((0x3d0000))
          actual=$(stat --format=%s "$image")
          if (( actual > maximum )); then
            echo "Firmware is ${actual} bytes; OTA slot is ${maximum} bytes" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$image" dist/hosty-cardputer.bin
          cp apps/shell-cardputer/build/bootloader/bootloader.bin dist/hosty-cardputer-bootloader.bin
          cp apps/shell-cardputer/build/partition_table/partition-table.bin dist/hosty-cardputer-partition-table.bin
          cp apps/shell-cardputer/build/ota_data_initial.bin dist/hosty-cardputer-ota-data.bin
          (
            cd dist
            sha256sum hosty-cardputer*.bin > SHA256SUMS
          )

      - name: Attest build provenance
        if: steps.guard.outputs.fresh == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/hosty-cardputer*.bin"

      - name: Publish rolling prerelease
        if: steps.guard.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag --force cardputer-dev "$GITHUB_SHA"
          git push --force origin refs/tags/cardputer-dev
          if gh release view cardputer-dev >/dev/null 2>&1; then
            gh release upload cardputer-dev dist/* --clobber
            gh release edit cardputer-dev --prerelease --title "Hosty Cardputer development firmware"
          else
            gh release create cardputer-dev dist/* \
              --prerelease \
              --title "Hosty Cardputer development firmware" \
              --notes "Rolling M5Stack Cardputer ADV development firmware from main."
          fi
