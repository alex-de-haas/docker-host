name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/host/**"
      - "apps/core/**"
      - "apps/shell/**"
      - "apps/demo-app/**"
      - "apps/cli/**"
      - "modules/demo-module/**"
      - "docs/features/host-api.md"
      - "scripts/install.sh"
      - "package.json"
      - "package-lock.json"
      - "global.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/host-image.yml"
      - ".github/workflows/demo-module-image.yml"
      - ".github/workflows/cli-release.yml"
  push:
    branches:
      - main
    paths:
      - "apps/host/**"
      - "apps/core/**"
      - "apps/shell/**"
      - "apps/demo-app/**"
      - "apps/cli/**"
      - "modules/demo-module/**"
      - "docs/features/host-api.md"
      - "scripts/install.sh"
      - "package.json"
      - "package-lock.json"
      - "global.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/host-image.yml"
      - ".github/workflows/demo-module-image.yml"
      - ".github/workflows/cli-release.yml"

jobs:
  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Shell
        run: npm run shell:build

  demo-app:
    name: Demo App
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Demo App
        if: github.event_name == 'push'
        run: npm run demo-app:lint

      - name: Build Demo App
        run: npm run demo-app:build

  legacy-demo-module:
    name: Legacy Demo Module
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Legacy Demo Module
        if: github.event_name == 'push'
        run: npm run lint --workspace @haas/docker-host-demo-module

      - name: Build Legacy Demo Module
        run: npm run build --workspace @haas/docker-host-demo-module

  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Core
        run: npm run core:build

      - name: Test Core
        if: github.event_name == 'push'
        run: npm run core:test

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate installer syntax
        if: github.event_name == 'push'
        run: sh -n scripts/install.sh

      - name: Build CLI
        run: npm run cli:build

      - name: Test CLI
        if: github.event_name == 'push'
        run: npm run cli:test
