name: CI

# The workflow itself has no `paths:` filter — it runs on every PR to main and every push to main, and
# each job decides for itself whether it has anything to do (see the `changes` job below).
#
# A workflow-level `paths:` filter cannot express this: it is a union over every component, so touching
# any one of them ran all ten jobs. It is also incompatible with required status checks — when the
# filter excludes a change the workflow never starts, the required checks never report, and the PR sits
# pending forever. A job skipped by `if:` reports as skipped, which counts as success.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Collapse superseded runs of the same pull request — every push to a branch used to start a full
  # matrix without cancelling the one before it. Pushes to main are keyed by commit instead, so no
  # main commit loses its validation to the commit merged a few seconds later.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Maps the changed files onto the components they affect — for pushes to main as much as for pull
  # requests. The push side used to skip the filter and run the full matrix: a merge that bumped one
  # Dockerfile still built the Swift client and the Cardputer firmware, ~10x the runner time the diff
  # justified, and it duplicated the gate jobs the image and release workflows already run before they
  # publish anything.
  #
  # What a push-side diff cannot catch is a semantic conflict between two PRs merged in parallel: this
  # repository uses merge commits, so main can differ from the tree any single PR tested. The branch
  # protection rule "Require branches to be up to date before merging" is what closes that gap — it
  # forces a PR onto current main before it can land, so the PR run and the push run see the same tree.
  # That rule is load-bearing here; if it is ever turned off, this filter has to go back to running the
  # full matrix on push.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Underscored, not hyphenated, and deliberately out of step with the hyphenated job ids: a `-` in an
    # expression property name parses as subtraction, so an `outputs.app-sdk` reference would silently
    # evaluate to something other than the output it appears to name.
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      app_sdk: ${{ steps.filter.outputs.app_sdk }}
      app_sdk_dotnet: ${{ steps.filter.outputs.app_sdk_dotnet }}
      demo_app: ${{ steps.filter.outputs.demo_app }}
      core: ${{ steps.filter.outputs.core }}
      cli: ${{ steps.filter.outputs.cli }}
      telemetry_backend: ${{ steps.filter.outputs.telemetry_backend }}
      marketplace: ${{ steps.filter.outputs.marketplace }}
      ai_gateway: ${{ steps.filter.outputs.ai_gateway }}
      telemetry_ui: ${{ steps.filter.outputs.telemetry_ui }}
      swift_shell: ${{ steps.filter.outputs.swift_shell }}
      cardputer_shell: ${{ steps.filter.outputs.cardputer_shell }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # A branch name, not a SHA: when `base` names the branch that was pushed to, the action diffs
          # against the push's `before` commit — for a merge commit that is the PR's whole changeset.
          # On pull_request events this input is ignored outright and the PR's base branch is used. On a
          # zero `before` (force-push, or a branch's first push) it degrades to listing every file as
          # added, so the full matrix runs rather than nothing.
          base: ${{ github.ref }}

          # Shared paths are scoped by runtime rather than pooled into one list. A single `global` pool
          # looked safe but made the filtering nearly inert: every version bump touches either
          # `package-lock.json` (npm workspaces record their version there) or `Directory.Build.props`
          # (the platform version), and AGENTS.md requires the bump in the same commit — so almost every
          # PR matched every filter. An npm lockfile cannot change a .NET build and the .NET SDK pin
          # cannot change a Node one, so the split costs nothing in safety.
          #
          # `package.json` is in both: the root manifest holds the `core:build` / `cli:build` /
          # `telemetry-backend:build` scripts the .NET jobs invoke, so it is not Node-only.
          #
          # The four Node apps also depend on the `@hosty-sdk/app` workspace package, so they list
          # `packages/app-sdk/**` too. The .NET projects reference nothing outside their own tree
          # (verified: each test csproj references only its sibling src csproj), so they stay narrow.
          filters: |
            node_shared: &node_shared
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

            dotnet_shared: &dotnet_shared
              - 'package.json'
              - 'global.json'
              - 'Directory.Build.props'
              - '.github/workflows/ci.yml'

            app_sdk:
              - *node_shared
              - 'packages/app-sdk/**'

            app_sdk_dotnet:
              - *dotnet_shared
              - 'packages/app-sdk-dotnet/**'

            shell:
              - *node_shared
              - 'packages/app-sdk/**'
              - 'apps/shell/**'

            demo_app:
              - *node_shared
              - 'packages/app-sdk/**'
              - 'apps/demo-app/**'

            marketplace:
              - *node_shared
              - 'packages/app-sdk/**'
              - 'apps/marketplace/**'

            ai_gateway:
              - *node_shared
              - 'packages/app-sdk/**'
              - 'apps/ai-gateway/**'

            telemetry_ui:
              - *node_shared
              - 'packages/app-sdk/**'
              - 'apps/telemetry-ui/**'

            core:
              - *dotnet_shared
              - 'apps/core/**'

            cli:
              - *dotnet_shared
              - 'apps/cli/**'
              - 'scripts/install.sh'
              - 'scripts/install.ps1'

            telemetry_backend:
              - *dotnet_shared
              - 'apps/telemetry-backend/**'

            # Shares nothing with the Node or .NET pools: the Apple client has its own toolchain and its
            # own version file, and it is the only job that needs a macOS runner.
            swift_shell:
              - 'apps/shell-swift/**'
              - '.github/workflows/ci.yml'

            cardputer_shell:
              - 'apps/shell-cardputer/**'
              - 'scripts/check-versions.mjs'
              - '.github/workflows/ci.yml'

            workflows:
              - '.github/workflows/**'
              # Composite actions the workflows call are linted by the same job.
              - '.github/actions/**'

  # Ungated on purpose: it reads version fields out of every manifest and package.json in the repo, so
  # any filter narrow enough to be useful would also be wrong. It needs no `npm ci` and finishes in
  # seconds.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check version consistency
        run: node scripts/check-versions.mjs

  # Ungated for the same reason as `versions`: it validates doc headers and the generated index across
  # the whole docs/ tree, needs no `npm ci`, and finishes in seconds.
  docs:
    name: Docs index
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check docs index and headers
        run: node scripts/docs-index.mjs --check

  # Type-checks the workflows themselves: expression syntax, `needs`/`outputs` references, action input
  # names, and shellcheck over every `run:` block. Added after a hyphenated `needs.changes.outputs.*`
  # reference shipped in #256 — a `-` there parses as subtraction, so the expression silently evaluated
  # to the wrong thing and nothing in CI could have noticed. The image is pinned; `latest` would let a
  # new release fail unrelated PRs.
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      # actionlint shellchecks `run:` blocks in workflows but never descends into a composite
      # action, so the publish guard's logic would otherwise ship unlinted. Same pinning rationale
      # as actionlint above: the runner's preinstalled shellcheck floats and would fail unrelated PRs.
      - name: Lint composite action scripts
        shell: bash
        # find/xargs rather than `mapfile` or `**`: both are bash 4+, so this stays runnable verbatim
        # on a macOS bash 3.2 for local reproduction.
        run: |
          set -euo pipefail
          if [[ -z "$(find .github/actions -type f -name '*.sh' -print -quit)" ]]; then
            echo "No composite action scripts found — drop this step or fix the pattern" >&2
            exit 1
          fi
          find .github/actions -type f -name '*.sh' -print0 | sort -z | xargs -0 \
            docker run --rm -v "$PWD":/repo -w /repo koalaman/shellcheck:v0.10.0

  shell:
    name: Shell
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Shell
        run: npm run shell:build

  app-sdk:
    name: App SDK
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app_sdk == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Test App SDK
        run: npm run sdk:test

  app-sdk-dotnet:
    name: App SDK (.NET)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app_sdk_dotnet == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test HostySdk.App
        run: dotnet test packages/app-sdk-dotnet/HostySdk.App.Tests/HostySdk.App.Tests.csproj

  demo-app:
    name: Demo App
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.demo_app == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Demo App
        run: npm run demo-app:lint

      - name: Build Demo App
        run: npm run demo-app:build

  core:
    name: Core
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build Core
        run: npm run core:build

      - name: Test Core
        run: npm run core:test

  cli:
    name: CLI
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate installer syntax
        run: |
          sh -n scripts/install.sh
          pwsh -NoProfile -File scripts/install.ps1 -Help > /dev/null

      - name: Build CLI
        run: npm run cli:build

      - name: Test CLI
        run: npm run cli:test

  telemetry-backend:
    name: Telemetry Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.telemetry_backend == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build Telemetry Backend
        run: npm run telemetry-backend:build

      - name: Test Telemetry Backend
        run: npm run telemetry-backend:test

  marketplace:
    name: Marketplace
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.marketplace == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Marketplace
        run: npm run marketplace:lint

      - name: Test Marketplace
        run: npm run marketplace:test

      - name: Build Marketplace
        run: npm run marketplace:build

  ai-gateway:
    name: AI Gateway
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ai_gateway == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint AI Gateway
        run: npm run ai-gateway:lint

      - name: Test AI Gateway
        run: npm run ai-gateway:test

  telemetry-ui:
    name: Telemetry UI
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.telemetry_ui == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Telemetry UI
        run: npm run telemetry-ui:lint

      - name: Test Telemetry UI
        run: npm run telemetry-ui:test

      - name: Build Telemetry UI
        run: npm run telemetry-ui:build

  swift-shell:
    name: Swift Shell
    # The only macOS job in the workflow: Xcode exists nowhere else. The repository is public, so
    # GitHub-hosted macOS runners are free; the paths filter keeps it off unrelated commits anyway.
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.swift_shell == 'true'
    defaults:
      run:
        working-directory: apps/shell-swift
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # A runner's *default* Xcode is not necessarily its newest, and this project needs Xcode 26: it
      # targets the iOS/macOS 26 SDKs and HostyKit declares swift-tools-version 6.2. Selecting the newest
      # installed and asserting the major version here turns "this runner is too old" into one readable
      # line, rather than an SDK or tools-version error several steps later that says nothing about why.
      - name: Select Xcode
        run: |
          latest="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          major="$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')"
          if [ "$major" -lt 26 ]; then
            echo "::error::apps/shell-swift needs Xcode 26 or newer; the newest on this runner is $latest"
            exit 1
          fi

      # The whole contract layer, without a simulator or a signing identity.
      - name: Test HostyKit
        run: swift test --package-path HostyKit

      - name: Build for macOS
        run: |
          xcodebuild build \
            -project Hosty.xcodeproj \
            -scheme Hosty \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      # A generic destination rather than a named device: which simulators a runner image ships changes
      # between image releases, and naming one would break on an image bump for no benefit.
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Hosty.xcodeproj \
            -scheme Hosty \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  cardputer-shell:
    name: Cardputer Shell
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cardputer_shell == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run bounded host tests
        run: apps/shell-cardputer/tools/host-test.sh

      - name: Build ESP32-S3 firmware
        run: apps/shell-cardputer/tools/docker-build.sh

      - name: Enforce OTA slot size and create checksum
        run: |
          set -euo pipefail
          image=apps/shell-cardputer/build/hosty_cardputer_shell.bin
          maximum=$((0x3d0000))
          actual=$(stat --format=%s "$image")
          if (( actual > maximum )); then
            echo "Firmware is ${actual} bytes; OTA slot is ${maximum} bytes" >&2
            exit 1
          fi
          # The container builds as root, so build/ is root-owned and this step cannot write into it.
          # Collect what gets uploaded in a directory this job owns instead.
          mkdir -p cardputer-artifacts
          cp "$image" cardputer-artifacts/
          ( cd cardputer-artifacts && sha256sum hosty_cardputer_shell.bin > SHA256SUMS )

      - name: Upload firmware verification artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hosty-cardputer-${{ github.sha }}
          path: cardputer-artifacts/
