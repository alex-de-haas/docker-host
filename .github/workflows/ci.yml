name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/core/**"
      - "apps/shell/**"
      - "apps/demo-app/**"
      - "apps/cli/**"
      - "docs/features/core-api.md"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "package.json"
      - "package-lock.json"
      - "global.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/shell-image.yml"
      - ".github/workflows/demo-app-image.yml"
      - ".github/workflows/cli-release.yml"
  push:
    branches:
      - main
    paths:
      - "apps/core/**"
      - "apps/shell/**"
      - "apps/demo-app/**"
      - "apps/cli/**"
      - "docs/features/core-api.md"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "package.json"
      - "package-lock.json"
      - "global.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/shell-image.yml"
      - ".github/workflows/demo-app-image.yml"
      - ".github/workflows/cli-release.yml"

permissions:
  contents: read

jobs:
  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Shell
        run: npm run shell:build

  demo-app:
    name: Demo App
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Demo App
        run: npm run demo-app:lint

      - name: Build Demo App
        run: npm run demo-app:build

  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Core
        run: npm run core:build

      - name: Test Core
        run: npm run core:test

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate installer syntax
        run: |
          sh -n scripts/install.sh
          pwsh -NoProfile -File scripts/install.ps1 -Help > /dev/null

      - name: Build CLI
        run: npm run cli:build

      - name: Test CLI
        run: npm run cli:test
