name: CI

# The workflow itself has no `paths:` filter — it runs on every PR to main and every push to main, and
# each job decides for itself whether it has anything to do (see the `changes` job below).
#
# A workflow-level `paths:` filter cannot express this: it is a union over every component, so touching
# any one of them ran all ten jobs. It is also incompatible with required status checks — when the
# filter excludes a change the workflow never starts, the required checks never report, and the PR sits
# pending forever. A job skipped by `if:` reports as skipped, which counts as success.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Maps the changed files onto the components they affect. Only consulted for pull requests: a push to
  # main is the release path (the image and CLI publish workflows fire off the same commits), so it
  # always runs the full matrix rather than trusting a diff.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Underscored, not hyphenated, and deliberately out of step with the hyphenated job ids: a `-` in an
    # expression property name parses as subtraction, so an `outputs.app-sdk` reference would silently
    # evaluate to something other than the output it appears to name.
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      app_sdk: ${{ steps.filter.outputs.app_sdk }}
      app_sdk_dotnet: ${{ steps.filter.outputs.app_sdk_dotnet }}
      demo_app: ${{ steps.filter.outputs.demo_app }}
      core: ${{ steps.filter.outputs.core }}
      cli: ${{ steps.filter.outputs.cli }}
      telemetry_backend: ${{ steps.filter.outputs.telemetry_backend }}
      marketplace: ${{ steps.filter.outputs.marketplace }}
      telemetry_ui: ${{ steps.filter.outputs.telemetry_ui }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          # Shared paths are scoped by runtime rather than pooled into one list. A single `global` pool
          # looked safe but made the filtering nearly inert: every version bump touches either
          # `package-lock.json` (npm workspaces record their version there) or `Directory.Build.props`
          # (the platform version), and AGENTS.md requires the bump in the same commit — so almost every
          # PR matched every filter. An npm lockfile cannot change a .NET build and the .NET SDK pin
          # cannot change a Node one, so the split costs nothing in safety.
          #
          # `package.json` is in both: the root manifest holds the `core:build` / `cli:build` /
          # `telemetry-backend:build` scripts the .NET jobs invoke, so it is not Node-only.
          #
          # The four Node apps also depend on the `@hosty-sdk/app` workspace package, so they list
          # `packages/app-sdk/**` too. The .NET projects reference nothing outside their own tree
          # (verified: each test csproj references only its sibling src csproj), so they stay narrow.
          filters: |
            node_shared: &node_shared
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

            dotnet_shared: &dotnet_shared
              - 'package.json'
              - 'global.json'
              - 'Directory.Build.props'
              - '.github/workflows/ci.yml'

            app_sdk:
              - *node_shared
              - 'packages/app-sdk/**'

            app_sdk_dotnet:
              - *dotnet_shared
              - 'packages/app-sdk-dotnet/**'

            shell:
              - *node_shared
              - 'packages/app-sdk/**'
              - 'apps/shell/**'

            demo_app:
              - *node_shared
              - 'packages/app-sdk/**'
              - 'apps/demo-app/**'

            marketplace:
              - *node_shared
              - 'packages/app-sdk/**'
              - 'apps/marketplace/**'

            telemetry_ui:
              - *node_shared
              - 'packages/app-sdk/**'
              - 'apps/telemetry-ui/**'

            core:
              - *dotnet_shared
              - 'apps/core/**'

            cli:
              - *dotnet_shared
              - 'apps/cli/**'
              - 'scripts/install.sh'
              - 'scripts/install.ps1'

            telemetry_backend:
              - *dotnet_shared
              - 'apps/telemetry-backend/**'

            workflows:
              - '.github/workflows/**'

  # Ungated on purpose: it reads version fields out of every manifest and package.json in the repo, so
  # any filter narrow enough to be useful would also be wrong. It needs no `npm ci` and finishes in
  # seconds.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check version consistency
        run: node scripts/check-versions.mjs

  # Type-checks the workflows themselves: expression syntax, `needs`/`outputs` references, action input
  # names, and shellcheck over every `run:` block. Added after a hyphenated `needs.changes.outputs.*`
  # reference shipped in #256 — a `-` there parses as subtraction, so the expression silently evaluated
  # to the wrong thing and nothing in CI could have noticed. The image is pinned; `latest` would let a
  # new release fail unrelated PRs.
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  shell:
    name: Shell
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.shell == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Shell
        run: npm run shell:build

  app-sdk:
    name: App SDK
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.app_sdk == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Test App SDK
        run: npm run sdk:test

  app-sdk-dotnet:
    name: App SDK (.NET)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.app_sdk_dotnet == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test HostySdk.App
        run: dotnet test packages/app-sdk-dotnet/HostySdk.App.Tests/HostySdk.App.Tests.csproj

  demo-app:
    name: Demo App
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.demo_app == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Demo App
        run: npm run demo-app:lint

      - name: Build Demo App
        run: npm run demo-app:build

  core:
    name: Core
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Core
        run: npm run core:build

      - name: Test Core
        run: npm run core:test

  cli:
    name: CLI
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.cli == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate installer syntax
        run: |
          sh -n scripts/install.sh
          pwsh -NoProfile -File scripts/install.ps1 -Help > /dev/null

      - name: Build CLI
        run: npm run cli:build

      - name: Test CLI
        run: npm run cli:test

  telemetry-backend:
    name: Telemetry Backend
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.telemetry_backend == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Telemetry Backend
        run: npm run telemetry-backend:build

      - name: Test Telemetry Backend
        run: npm run telemetry-backend:test

  marketplace:
    name: Marketplace
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.marketplace == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Marketplace
        run: npm run marketplace:lint

      - name: Test Marketplace
        run: npm run marketplace:test

      - name: Build Marketplace
        run: npm run marketplace:build

  telemetry-ui:
    name: Telemetry UI
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.telemetry_ui == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Telemetry UI
        run: npm run telemetry-ui:lint

      - name: Test Telemetry UI
        run: npm run telemetry-ui:test

      - name: Build Telemetry UI
        run: npm run telemetry-ui:build
