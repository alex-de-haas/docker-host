name: CI

# Automatic affected component tests and builds. The final ci-required job is the stable gate.
# No workflow-level path filter: documentation-only PRs must still report a result.
on:
  pull_request:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      revision:
        description: Exact source revision to qualify (resolved and recorded as a full commit SHA)
        default: main
        type: string

permissions:
  contents: read

concurrency:
  # Collapse superseded runs of the same pull request — every push to a branch used to start a full
  # matrix without cancelling the one before it. Pushes to main are keyed by commit instead, so no
  # main commit loses its validation to the commit merged a few seconds later.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.revision || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  changes:
    name: Detect changes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      desktop: ${{ steps.filter.outputs.desktop }}
      app_sdk: ${{ steps.filter.outputs.app_sdk }}
      app_sdk_dotnet: ${{ steps.filter.outputs.app_sdk_dotnet }}
      whisper: ${{ steps.filter.outputs.whisper }}
      opus: ${{ steps.filter.outputs.opus }}
      demo_app: ${{ steps.filter.outputs.demo_app }}
      core: ${{ steps.filter.outputs.core }}
      core_aot: ${{ steps.filter.outputs.core_aot }}
      cli: ${{ steps.filter.outputs.cli }}
      telemetry_backend: ${{ steps.filter.outputs.telemetry_backend }}
      marketplace: ${{ steps.filter.outputs.marketplace }}
      documents: ${{ steps.filter.outputs.documents }}
      harness: ${{ steps.filter.outputs.harness }}
      telemetry_ui: ${{ steps.filter.outputs.telemetry_ui }}
      swift_shell: ${{ steps.filter.outputs.swift_shell }}
      cardputer_shell: ${{ steps.filter.outputs.cardputer_shell }}
      workflows: ${{ steps.filter.outputs.workflows }}
      plan: ${{ steps.filter.outputs.plan }}
      sha: ${{ steps.filter.outputs.sha }}
    steps:
      - name: Check out workflow source and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Select affected checks and record exact source
        id: filter
        run: node scripts/ci-select.mjs
      - name: Preserve exact push selection for publication
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-selection-${{ steps.filter.outputs.sha }}
          path: ${{ runner.temp }}/hosty-ci-selection/selection.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  ci-policy:
    name: CI policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test selection, required gate and publication denial
        run: node --test scripts/ci*.test.mjs scripts/test-integration.test.mjs .github/actions/ci-validation-gate/*.test.mjs

  # Ungated on purpose: it reads version fields out of every manifest and package.json in the repo, so
  # any filter narrow enough to be useful would also be wrong. It needs no `npm ci` and finishes in
  # seconds.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check version consistency
        run: node scripts/check-versions.mjs

  # Ungated for the same reason as `versions`: it validates doc frontmatter, deliverables, links and the
  # generated index across the whole docs/ tree, needs no `npm ci`, and finishes in seconds.
  docs:
    name: Docs index
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test the docs validator
        run: node --test scripts/docs-index.test.mjs scripts/docs-format.test.mjs scripts/docs-git.test.mjs

      - name: Check docs index and frontmatter
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOCS_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/docs-index.mjs --check

  # Type-checks the workflows themselves: expression syntax, `needs`/`outputs` references, action input
  # names, and shellcheck over every `run:` block. Added after a hyphenated `needs.changes.outputs.*`
  # reference shipped in #256 — a `-` there parses as subtraction, so the expression silently evaluated
  # to the wrong thing and nothing in CI could have noticed. The image is pinned; `latest` would let a
  # new release fail unrelated PRs.
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      # actionlint shellchecks `run:` blocks in workflows but never descends into a composite
      # action, so the publish guard's logic would otherwise ship unlinted. Same pinning rationale
      # as actionlint above: the runner's preinstalled shellcheck floats and would fail unrelated PRs.
      - name: Lint composite action scripts
        shell: bash
        # find/xargs rather than `mapfile` or `**`: both are bash 4+, so this stays runnable verbatim
        # on a macOS bash 3.2 for local reproduction.
        run: |
          set -euo pipefail
          if [[ -z "$(find .github/actions -type f -name '*.sh' -print -quit)" ]]; then
            echo "No composite action scripts found — drop this step or fix the pattern" >&2
            exit 1
          fi
          find .github/actions -type f -name '*.sh' -print0 | sort -z | xargs -0 \
            docker run --rm -v "$PWD":/repo -w /repo koalaman/shellcheck:v0.10.0

  shell:
    name: Shell
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint and test Shell
        run: |
          npm run shell:lint
          npm run shell:test

      - name: Build Shell
        run: npm run shell:build

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint and test Desktop
        run: |
          npm run desktop:lint
          npm run desktop:test

      - name: Build Desktop
        run: npm run desktop:build

  app-sdk:
    name: App SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.app_sdk == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Test App SDK
        run: npm run sdk:test

      - name: Verify SDK build and overlay upgrade contract
        run: |
          npm run build --workspace @hosty-sdk/app
          node packages/app-sdk/scripts/check-overlay-upgrade.mjs

  app-sdk-dotnet:
    name: App SDK (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.app_sdk_dotnet == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Test HostySdk.App
        run: dotnet test packages/app-sdk-dotnet/HostySdk.App.Tests/HostySdk.App.Tests.csproj

  whisper:
    name: Whisper
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.whisper == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: ./.github/actions/setup-dotnet
      - name: Test Whisper provider (bounded unit suite)
        run: dotnet test apps/whisper/Hosty.Whisper.Tests/Hosty.Whisper.Tests.csproj

  demo-app:
    name: Demo App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.demo_app == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Demo App
        run: npm run demo-app:lint

      - name: Test Demo App
        run: npm run test --workspace @haas/hosty-demo-app

      - name: Build Demo App
        run: npm run demo-app:build

  core:
    name: Core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.core == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Build Core
        run: npm run core:build

      - name: Test Core
        run: npm run core:test

  core-aot:
    name: Core NativeAOT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.core_aot == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: ./.github/actions/setup-dotnet
      - name: Ensure NativeAOT prerequisites
        run: |
          if ! command -v clang >/dev/null || ! dpkg-query -W -f='${Status}' zlib1g-dev 2>/dev/null | grep -q 'install ok installed'; then
            sudo apt-get update
            sudo apt-get install -y clang zlib1g-dev
          fi
      - name: Publish Core and reject new trim/AOT warnings
        run: npm run core:aot

  cli:
    name: CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Validate installer syntax
        run: |
          sh -n scripts/install.sh
          pwsh -NoProfile -File scripts/install.ps1 -Help > /dev/null

      - name: Build CLI
        run: npm run cli:build

      - name: Test CLI
        run: npm run cli:test

  telemetry-backend:
    name: Telemetry Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.telemetry_backend == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Build Telemetry Backend
        run: npm run telemetry-backend:build

      - name: Test Telemetry Backend
        run: npm run telemetry-backend:test

  marketplace:
    name: Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.marketplace == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Marketplace
        run: npm run marketplace:lint

      - name: Test Marketplace
        run: npm run marketplace:test

      - name: Build Marketplace
        run: npm run marketplace:build

  opus:
    name: OPUS Translate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.opus == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run opus:build
      - run: npm run opus:test
      - name: Verify model cache boundaries without downloading weights
        run: python3 -m unittest discover -s apps/opus/runtime -p 'test_*.py'

  documents:
    name: Documents
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.documents == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Documents
        run: npm run documents:lint

      - name: Test Documents
        run: npm run documents:test

      - name: Build Documents
        run: npm run documents:build

  harness:
    name: Hosty Harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Hosty Harness
        run: npm run harness:lint

      # The settings page is a static export the gateway serves; its tests fetch it, so it must
      # exist before they run.
      - name: Build Hosty Harness settings page
        run: npm run harness:build-web

      - name: Test Hosty Harness
        run: npm run harness:test

  telemetry-ui:
    name: Telemetry UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.telemetry_ui == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Telemetry UI
        run: npm run telemetry-ui:lint

      - name: Test Telemetry UI
        run: npm run telemetry-ui:test

      - name: Build Telemetry UI
        run: npm run telemetry-ui:build

  swift-shell:
    name: Swift Shell
    # The only macOS job in the workflow: Xcode exists nowhere else. The repository is public, so
    # GitHub-hosted macOS runners are free; the paths filter keeps it off unrelated commits anyway.
    runs-on: macos-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.swift_shell == 'true'
    defaults:
      run:
        working-directory: apps/shell-swift
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      # A runner's *default* Xcode is not necessarily its newest, and this project needs Xcode 26: it
      # targets the iOS/macOS 26 SDKs and HostyKit declares swift-tools-version 6.2. Selecting the newest
      # installed and asserting the major version here turns "this runner is too old" into one readable
      # line, rather than an SDK or tools-version error several steps later that says nothing about why.
      - name: Select Xcode
        run: |
          latest="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          major="$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')"
          if [ "$major" -lt 26 ]; then
            echo "::error::apps/shell-swift needs Xcode 26 or newer; the newest on this runner is $latest"
            exit 1
          fi

      # The whole contract layer, without a simulator or a signing identity.
      - name: Test HostyKit
        run: swift test --package-path HostyKit

      - name: Build for macOS
        run: |
          xcodebuild build \
            -project Hosty.xcodeproj \
            -scheme Hosty \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      # A generic destination rather than a named device: which simulators a runner image ships changes
      # between image releases, and naming one would break on an image bump for no benefit.
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Hosty.xcodeproj \
            -scheme Hosty \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  cardputer-shell:
    name: Cardputer Shell
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.cardputer_shell == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Run bounded host tests
        run: apps/shell-cardputer/tools/host-test.sh

      - name: Build ESP32-S3 firmware
        run: apps/shell-cardputer/tools/docker-build.sh

      - name: Enforce OTA slot size and create checksum
        run: |
          set -euo pipefail
          image=apps/shell-cardputer/build/hosty_cardputer_shell.bin
          maximum=$((0x3d0000))
          actual=$(stat --format=%s "$image")
          if (( actual > maximum )); then
            echo "Firmware is ${actual} bytes; OTA slot is ${maximum} bytes" >&2
            exit 1
          fi
          # The container builds as root, so build/ is root-owned and this step cannot write into it.
          # Collect what gets uploaded in a directory this job owns instead.
          mkdir -p cardputer-artifacts
          cp "$image" cardputer-artifacts/hosty-cardputer.bin
          cp apps/shell-cardputer/build/bootloader/bootloader.bin cardputer-artifacts/hosty-cardputer-bootloader.bin
          cp apps/shell-cardputer/build/partition_table/partition-table.bin cardputer-artifacts/hosty-cardputer-partition-table.bin
          cp apps/shell-cardputer/build/ota_data_initial.bin cardputer-artifacts/hosty-cardputer-ota-data.bin
          ( cd cardputer-artifacts && sha256sum hosty-cardputer*.bin > SHA256SUMS )
          node -e 'require("node:fs").writeFileSync("cardputer-artifacts/verification.json", JSON.stringify({sourceSha: process.env.SOURCE_SHA, format: 1}) + "\n")'
        env:
          SOURCE_SHA: ${{ needs.changes.outputs.sha }}

      - name: Upload firmware verification artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosty-cardputer-${{ needs.changes.outputs.sha }}
          overwrite: true
          path: cardputer-artifacts/

  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, versions, docs, ci-policy, actionlint, shell, desktop, app-sdk, app-sdk-dotnet, whisper, opus, demo-app, core, core-aot, cli, telemetry-backend, marketplace, documents, harness, telemetry-ui, swift-shell, cardputer-shell]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require every selected check to succeed
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-policy.mjs gate
