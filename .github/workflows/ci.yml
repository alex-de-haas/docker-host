name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/core/**"
      - "apps/shell/**"
      - "apps/demo-app/**"
      - "apps/cli/**"
      - "docs/features/core-api.md"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "package.json"
      - "package-lock.json"
      - "packages/app-sdk/**"
      - "packages/app-sdk-dotnet/**"
      - "global.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/shell-image.yml"
      - ".github/workflows/demo-app-image.yml"
      - ".github/workflows/cli-release.yml"
      - "apps/telemetry-backend/**"
      - "apps/telemetry/manifest.json"
      - "channels/**"
      - "scripts/**"
      - "Directory.Build.props"
      - ".github/workflows/telemetry-backend-image.yml"
      - "apps/marketplace/**"
      - ".github/workflows/marketplace-image.yml"
      - "apps/telemetry-ui/**"
      - ".github/workflows/telemetry-ui-image.yml"
  push:
    branches:
      - main
    paths:
      - "apps/core/**"
      - "apps/shell/**"
      - "apps/demo-app/**"
      - "apps/cli/**"
      - "docs/features/core-api.md"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "package.json"
      - "package-lock.json"
      - "global.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/shell-image.yml"
      - ".github/workflows/demo-app-image.yml"
      - ".github/workflows/cli-release.yml"
      - "apps/telemetry-backend/**"
      - "apps/telemetry/manifest.json"
      - "channels/**"
      - "scripts/**"
      - "Directory.Build.props"
      - ".github/workflows/telemetry-backend-image.yml"
      - "apps/marketplace/**"
      - ".github/workflows/marketplace-image.yml"
      - "apps/telemetry-ui/**"
      - ".github/workflows/telemetry-ui-image.yml"

permissions:
  contents: read

jobs:
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check version consistency
        run: node scripts/check-versions.mjs

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Shell
        run: npm run shell:build

  app-sdk:
    name: App SDK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Test App SDK
        run: npm run sdk:test

  app-sdk-dotnet:
    name: App SDK (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test HostySdk.App
        run: dotnet test packages/app-sdk-dotnet/HostySdk.App.Tests/HostySdk.App.Tests.csproj

  demo-app:
    name: Demo App
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Demo App
        run: npm run demo-app:lint

      - name: Build Demo App
        run: npm run demo-app:build

  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Core
        run: npm run core:build

      - name: Test Core
        run: npm run core:test

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate installer syntax
        run: |
          sh -n scripts/install.sh
          pwsh -NoProfile -File scripts/install.ps1 -Help > /dev/null

      - name: Build CLI
        run: npm run cli:build

      - name: Test CLI
        run: npm run cli:test

  telemetry-backend:
    name: Telemetry Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Telemetry Backend
        run: npm run telemetry-backend:build

      - name: Test Telemetry Backend
        run: npm run telemetry-backend:test

  marketplace:
    name: Marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Marketplace
        run: npm run marketplace:lint

      - name: Test Marketplace
        run: npm run marketplace:test

      - name: Build Marketplace
        run: npm run marketplace:build

  telemetry-ui:
    name: Telemetry UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Telemetry UI
        run: npm run telemetry-ui:lint

      - name: Test Telemetry UI
        run: npm run telemetry-ui:test

      - name: Build Telemetry UI
        run: npm run telemetry-ui:build
