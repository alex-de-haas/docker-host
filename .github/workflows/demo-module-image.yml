name: Demo Module Image

on:
  push:
    branches:
      - main
    tags:
      - "demo-module-v*"
    paths:
      - "modules/demo-module/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/demo-module-image.yml"
  pull_request:
    branches:
      - main
    paths:
      - "modules/demo-module/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/demo-module-image.yml"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compute image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/demo-module" >> "$GITHUB_OUTPUT"

      - name: Read demo module version
        id: module
        shell: bash
        run: |
          version=$(node -p "require('./modules/demo-module/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=pr
            type=match,pattern=demo-module-v(.*),group=1
            type=sha,prefix=sha-
            type=raw,value=${{ steps.module.outputs.version }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Demo Module image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./modules/demo-module/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
