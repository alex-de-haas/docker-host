name: Hosty Release Assets

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    # Ignore non-push, failed and foreign CI completions before allocating a runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: Require full CI for this main SHA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.validation.outputs.publish }}
      run-id: ${{ steps.validation.outputs.run-id }}
      source-sha: ${{ steps.validation.outputs.source-sha }}
    steps:
      # Select with trusted default-branch policy, then build only the validated source commit.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Set up Node.js for publication policy
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require successful main CI
        id: validation
        uses: ./.github/actions/ci-validation-gate
        with:
          token: ${{ github.token }}
          components: core,cli
          native-release-tag: cli-dev

  # Gate publishing on the tests for exactly what this workflow ships (Core + CLI). Without it a commit
  # whose tests fail still force-retags `cli-dev` — the default install/update target — and re-uploads
  # binaries, since publishing ran in parallel with (not gated on) CI. Every publish job needs this.
  test:
    needs: validation
    if: needs.validation.outputs.publish == 'true'
    name: Gate on tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validation.outputs.source-sha }}

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Build Core
        run: npm run core:build

      - name: Test Core
        run: npm run core:test

      - name: Build CLI
        run: npm run cli:build

      - name: Test CLI
        run: npm run cli:test

  publish-artifacts:
    name: Build ${{ matrix.rid }}
    needs: [validation, test]
    env:
      HostyBuildRepository: ${{ github.server_url }}/${{ github.repository }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            artifact: hosty-darwin-arm64
            core_artifact: hosty-core-darwin-arm64
          - os: macos-latest
            rid: osx-x64
            artifact: hosty-darwin-x64
            core_artifact: hosty-core-darwin-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            artifact: hosty-linux-arm64
            core_artifact: hosty-core-linux-arm64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: hosty-linux-x64
            core_artifact: hosty-core-linux-x64
          - os: windows-latest
            rid: win-x64
            artifact: hosty-windows-x64.exe
            core_artifact: hosty-core-windows-x64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validation.outputs.source-sha }}

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Resolve product version
        id: product_version
        shell: bash
        # The platform (Core + CLI) version source of truth is Directory.Build.props <Version>
        # (docs/features/repository-release-model/feature.md). The root package.json is the private monorepo
        # container, not the platform version — reading it here stamped published binaries with a stale
        # 0.5.0 while Directory.Build.props had advanced, so Core reported the wrong version.
        run: |
          version=$(grep -oE '<Version>[^<]+</Version>' Directory.Build.props | sed -E 's#</?Version>##g')
          if [[ -z "$version" ]]; then
            echo "Could not resolve <Version> from Directory.Build.props" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish CLI executable (Native AOT)
        shell: bash
        run: |
          dotnet publish apps/cli/src/Haas.Hosty.Cli/Haas.Hosty.Cli.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            -p:Version=${{ steps.product_version.outputs.version }} \
            --output artifacts

      # The matrix values reach the script through env rather than inline `${{ }}`: shellcheck cannot see
      # through the interpolation and reads the guard as a comparison that can never match (SC2193).
      # Binding them first is also the idiomatic way to keep workflow values out of a script body.
      - name: Normalize artifact name
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          if [[ "$RID" == win-* ]]; then
            mv artifacts/hosty.exe "artifacts/$ARTIFACT"
          else
            mv artifacts/hosty "artifacts/$ARTIFACT"
            chmod +x "artifacts/$ARTIFACT"
          fi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}

      - name: Publish Core executable (Native AOT)
        shell: bash
        run: |
          dotnet publish apps/core/src/Haas.Hosty.Core/Haas.Hosty.Core.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            -p:Version=${{ steps.product_version.outputs.version }} \
            --output core-artifacts

      # Same SC2193 shape as "Normalize artifact name" above.
      - name: Normalize Core artifact name
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          CORE_ARTIFACT: ${{ matrix.core_artifact }}
        run: |
          if [[ "$RID" == win-* ]]; then
            mv core-artifacts/hosty-core.exe "core-artifacts/$CORE_ARTIFACT"
          else
            mv core-artifacts/hosty-core "core-artifacts/$CORE_ARTIFACT"
            chmod +x "core-artifacts/$CORE_ARTIFACT"
          fi

      - name: Upload Core artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.core_artifact }}
          path: core-artifacts/${{ matrix.core_artifact }}

  publish-cli-dev-release:
    name: Publish cli-dev release
    needs: [validation, publish-artifacts]
    runs-on: ubuntu-latest
    concurrency:
      group: cli-dev-release
      cancel-in-progress: false
    permissions:
      contents: write
      # Provenance attestation (I-M2): SHA256SUMS is same-origin with the binaries (integrity, not
      # authenticity). A signed build-provenance attestation lets consumers verify the binaries were
      # produced by this repo's workflow. Needs an OIDC token + attestations write.
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validation.outputs.source-sha }}

      # `cli-dev` is force-retagged and its assets are clobbered, so this job has no immutable output
      # to fall back on: an older run admitted to the group after a newer one would move the default
      # install/update target backwards. Nothing is published unless this commit is still the tip of
      # main; the newer run has already shipped, or is queued behind us.
      #
      # First step after checkout on purpose. This job *is* the concurrency unit, so every step it
      # runs holds the `cli-dev-release` slot shut against the fresh run waiting behind it — a stale
      # run must decide before doing work it will throw away, not after.
      - name: Guard the rolling tag
        id: guard
        uses: ./.github/actions/publish-guard
        with:
          source-sha: ${{ needs.validation.outputs.source-sha }}

      - name: Download release artifacts
        if: steps.guard.outputs.fresh == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          path: release-assets

      - name: Prepare release assets
        if: steps.guard.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          expected=(
            hosty-darwin-arm64
            hosty-darwin-x64
            hosty-linux-arm64
            hosty-linux-x64
            hosty-windows-x64.exe
            hosty-core-darwin-arm64
            hosty-core-darwin-x64
            hosty-core-linux-arm64
            hosty-core-linux-x64
            hosty-core-windows-x64.exe
          )

          for artifact in "${expected[@]}"; do
            source="release-assets/${artifact}/${artifact}"
            if [[ ! -f "${source}" ]]; then
              echo "Missing expected artifact: ${source}" >&2
              find release-assets -maxdepth 3 -type f -print >&2
              exit 1
            fi

            cp "${source}" "dist/${artifact}"
          done

          # Display-only version marker for the release. Core's update check compares binary hashes
          # against SHA256SUMS and keeps doing so — this file only lets a client name the version an
          # update would install, which a hash comparison cannot. It stays out of SHA256SUMS
          # deliberately: tampering with it can mislabel a version, never smuggle a binary past the
          # checksum gate, and a client that never sees it degrades to naming no version at all.
          #
          # Read from Directory.Build.props here rather than carried over from publish-artifacts'
          # `product_version`: that output belongs to a different job. The guard above has already
          # established that this checkout is still main's tip, so it is the same commit the matrix
          # job stamped its binaries from.
          version=$(grep -oE '<Version>[^<]+</Version>' Directory.Build.props | sed -E 's#</?Version>##g')
          if [[ -z "$version" ]]; then
            echo "Could not resolve <Version> from Directory.Build.props" >&2
            exit 1
          fi
          printf '%s\n' "$version" > dist/VERSION

          (
            cd dist
            sha256sum "${expected[@]}" > SHA256SUMS
            ls -la
          )

      - name: Prepare source-bound provenance
        if: steps.guard.outputs.fresh == 'true'
        env:
          PUBLISH_SOURCE_SHA: ${{ needs.validation.outputs.source-sha }}
          VALIDATED_CI_RUN_ID: ${{ needs.validation.outputs.run-id }}
          PUBLICATION_KIND: build-native-release
        run: node .github/actions/ci-validation-gate/provenance.mjs

      - name: Attest build provenance
        if: steps.guard.outputs.fresh == 'true'
        uses: actions/attest@v4
        with:
          predicate-type: https://github.com/alex-de-haas/docker-host/blob/main/docs/features/ci-feedback-loop/feature.md#publication-provenance-v1
          predicate-path: publication-provenance.json
          subject-path: "dist/hosty-*"

      - name: Publish rolling prerelease
        if: steps.guard.outputs.fresh == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SOURCE_SHA: ${{ needs.validation.outputs.source-sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force cli-dev "${PUBLISH_SOURCE_SHA}"
          git push --force origin refs/tags/cli-dev

          cat > release-notes.md <<EOF
          Rolling development release for Hosty CLI and Core.

          Commit: ${PUBLISH_SOURCE_SHA}
          Published commit: ${PUBLISH_SOURCE_SHA}

          Assets are overwritten by the CLI release workflow on each main build.
          EOF

          if gh release view cli-dev >/dev/null 2>&1; then
            gh release upload cli-dev dist/* --clobber
          else
            gh release create cli-dev dist/* \
              --title "Hosty development build" \
              --notes "Publication in progress; no completed source receipt yet." \
              --prerelease
          fi

          # Record completion last. Failed uploads leave the previous receipt so a later
          # successful main CI run can recover even when its own push changes no native files.
          gh release edit cli-dev \
            --title "Hosty development build" \
            --notes-file release-notes.md \
            --prerelease
