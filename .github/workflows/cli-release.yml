name: CLI Release Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/cli/**"
      - "docs/features/core-api.md"
      - "scripts/install.sh"
      - "global.json"
      - ".github/workflows/cli-release.yml"

jobs:
  publish-artifacts:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            artifact: hosty-darwin-arm64
          - os: macos-latest
            rid: osx-x64
            artifact: hosty-darwin-x64
          - os: ubuntu-latest
            rid: linux-arm64
            artifact: hosty-linux-arm64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: hosty-linux-x64
          - os: windows-latest
            rid: win-x64
            artifact: hosty-windows-x64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish CLI executable
        shell: bash
        run: |
          dotnet publish apps/cli/src/Haas.Hosty.Cli/Haas.Hosty.Cli.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            --output artifacts

      - name: Normalize artifact name
        shell: bash
        run: |
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            mv artifacts/hosty.exe "artifacts/${{ matrix.artifact }}"
          else
            mv artifacts/hosty "artifacts/${{ matrix.artifact }}"
            chmod +x "artifacts/${{ matrix.artifact }}"
          fi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}

  publish-cli-dev-release:
    name: Publish cli-dev release
    needs: publish-artifacts
    runs-on: ubuntu-latest
    concurrency:
      group: cli-dev-release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          expected=(
            hosty-darwin-arm64
            hosty-darwin-x64
            hosty-linux-arm64
            hosty-linux-x64
            hosty-windows-x64.exe
          )

          for artifact in "${expected[@]}"; do
            source="release-assets/${artifact}/${artifact}"
            if [[ ! -f "${source}" ]]; then
              echo "Missing expected artifact: ${source}" >&2
              find release-assets -maxdepth 3 -type f -print >&2
              exit 1
            fi

            cp "${source}" "dist/${artifact}"
          done

          (
            cd dist
            sha256sum "${expected[@]}" > SHA256SUMS
            ls -la
          )

      - name: Publish rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force cli-dev "${GITHUB_SHA}"
          git push --force origin refs/tags/cli-dev

          cat > release-notes.md <<EOF
          Rolling development release for the Hosty CLI.

          Commit: ${GITHUB_SHA}

          Assets are overwritten by the CLI release workflow on each main build.
          EOF

          if gh release view cli-dev >/dev/null 2>&1; then
            gh release edit cli-dev \
              --title "CLI development build" \
              --notes-file release-notes.md \
              --prerelease
            gh release upload cli-dev dist/* --clobber
          else
            gh release create cli-dev dist/* \
              --title "CLI development build" \
              --notes-file release-notes.md \
              --prerelease
          fi
